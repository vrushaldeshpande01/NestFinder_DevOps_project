---
# Namespace for NestFinder application
apiVersion: v1
kind: Namespace
metadata:
  name: nestfinder

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nestfinder-config
  namespace: nestfinder
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"

---
# Secret for Gemini API key
apiVersion: v1
kind: Secret
metadata:
  name: gemini-api-key
  namespace: nestfinder
type: Opaque
stringData:
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY_HERE"  # Replace with actual API key

---
# ServiceAccount for NestFinder pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nestfinder-sa
  namespace: nestfinder

---
# Deployment for NestFinder application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestfinder
  namespace: nestfinder
  labels:
    app: nestfinder
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nestfinder
  template:
    metadata:
      labels:
        app: nestfinder
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: nestfinder-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      containers:
      - name: nestfinder-app
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/nestfinder/nestfinder-app:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        
        # Environment variables from ConfigMap and Secret
        envFrom:
        - configMapRef:
            name: nestfinder-config
        - secretRef:
            name: gemini-api-key
        
        # Additional environment variables
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: GEMINI_API_KEY
        
        # Liveness probe - checks if container is alive
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe - checks if container is ready to accept traffic
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Resource limits and requests
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        
        # Volume mounts (if needed)
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      
      # Pod affinity rules
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - nestfinder
              topologyKey: kubernetes.io/hostname
      
      # Restart policy
      restartPolicy: Always
      
      # Termination grace period
      terminationGracePeriodSeconds: 30

---
# Service to expose NestFinder
apiVersion: v1
kind: Service
metadata:
  name: nestfinder-service
  namespace: nestfinder
  labels:
    app: nestfinder
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: nestfinder

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nestfinder-hpa
  namespace: nestfinder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nestfinder
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
# Ingress for external access via ALB
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nestfinder-ingress
  namespace: nestfinder
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Optional: Use ACM certificate for HTTPS
    # alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:123456789012:certificate/xxx"
spec:
  rules:
  - host: nestfinder.yourdomain.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nestfinder-service
            port:
              number: 80
  # HTTP fallback rule for any host
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nestfinder-service
            port:
              number: 80

---
# NetworkPolicy to restrict traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nestfinder-network-policy
  namespace: nestfinder
spec:
  podSelector:
    matchLabels:
      app: nestfinder
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: nestfinder
    ports:
    - protocol: TCP
      port: 3000
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels: {}
    ports:
    - protocol: UDP
      port: 53
  # Allow HTTPS to Gemini API
  - to:
    - namespaceSelector:
        matchLabels: {}
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP (if needed for Gemini API)
  - to:
    - namespaceSelector:
        matchLabels: {}
    ports:
    - protocol: TCP
      port: 80
